name: Build Kernel (Force Fix APatch & Net)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: write
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Setup Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y git make bc bison flex build-essential libssl-dev libncurses5-dev unzip zip

    - name: Get Proton Clang
      uses: actions/checkout@v4
      with:
        repository: kdrag0n/proton-clang
        path: clang-toolchain
        fetch-depth: 1

    - name: Clone Kernel Source
      run: |
        git clone --depth=1 --branch 14 https://github.com/hac4us06/kernel-xiaomi-electro android-kernel

    - name: Build Kernel
      run: |
        cd android-kernel
        export PATH=$GITHUB_WORKSPACE/clang-toolchain/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export KBUILD_BUILD_USER="Tamjid"
        export KBUILD_BUILD_HOST="NetHunter-PC"
        
        # 1. Clean Everything
        make O=out clean
        make O=out mrproper

        # --- 🔥 STEP 1: FORCE EDIT DEFCONFIG (আসল ফিক্স) 🔥 ---
        # আমরা সরাসরি কনফিগ ফাইলে লিখে দিচ্ছি যাতে বিল্ড সিস্টেম মুছতে না পারে
        
        # APatch Fix (Must be 'y')
        echo "CONFIG_KALLSYMS=y" >> arch/arm64/configs/vendor/chime_defconfig
        echo "CONFIG_KALLSYMS_ALL=y" >> arch/arm64/configs/vendor/chime_defconfig
        echo "CONFIG_KALLSYMS_ABSOLUTE_PERCPU=y" >> arch/arm64/configs/vendor/chime_defconfig
        
        # Magisk Delta / KSU Support
        echo "CONFIG_KPROBES=y" >> arch/arm64/configs/vendor/chime_defconfig
        echo "CONFIG_HAVE_KPROBES=y" >> arch/arm64/configs/vendor/chime_defconfig
        echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/vendor/chime_defconfig
        echo "CONFIG_OVERLAY_FS=y" >> arch/arm64/configs/vendor/chime_defconfig
        
        # Network Fix (Module Version Check Disable)
        # এটি দিলে পুরনো মডিউলগুলো নতুন কার্নেলে লোড হবে (WiFi ঠিক হবে)
        echo "CONFIG_MODVERSIONS=n" >> arch/arm64/configs/vendor/chime_defconfig
        echo "# CONFIG_MODULE_SIG is not set" >> arch/arm64/configs/vendor/chime_defconfig

        # NetHunter HID Support
        echo "CONFIG_USB_CONFIGFS_F_HID=y" >> arch/arm64/configs/vendor/chime_defconfig
        echo "CONFIG_USB_F_HID=y" >> arch/arm64/configs/vendor/chime_defconfig

        # -----------------------------------------------------------

        # 2. Load the Modified Config
        make O=out vendor/chime_defconfig

        # 3. Build
        make -j$(nproc --all) O=out \
             CC=clang \
             CROSS_COMPILE=aarch64-linux-gnu- \
             CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
             LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
             KCFLAGS="-w"

    - name: Smart Pack (AnyKernel3)
      run: |
        git clone https://github.com/osm0sis/AnyKernel3
        
        # Script Fix
        rm AnyKernel3/anykernel.sh
        cat <<EOF > AnyKernel3/anykernel.sh
        properties() { '
        kernel.string=NetHunter-Fixed by Tamjid
        do.devicecheck=0
        do.modules=0
        do.systemless=1
        do.cleanup=1
        do.cleanuponabort=0
        '; }
        block=/dev/block/bootdevice/by-name/boot;
        is_slot_device=0;
        ramdisk_compression=auto;
        patch_vbmeta_flag=auto;
        . tools/ak3-core.sh;
        dump_boot;
        write_boot;
        EOF

        # Copy Image
        find android-kernel/out/arch/arm64/boot -name "Image*" -print -exec cp {} AnyKernel3/ \;
        find android-kernel/out/arch/arm64/boot -name "dtbo.img" -print -exec cp {} AnyKernel3/ \; || true

        cd AnyKernel3
        mv Image.gz-dtb Image || true
        mv Image.gz Image || true
        
        zip -r9 kernel-apatch-fixed.zip *

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: APatch-Fixed-Kernel
        path: AnyKernel3/kernel-apatch-fixed.zip
