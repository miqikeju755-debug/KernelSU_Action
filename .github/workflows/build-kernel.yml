name: Build Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: write
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Setup Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y git make bc bison flex build-essential libssl-dev libncurses5-dev unzip zip

    - name: Get Proton Clang
      uses: actions/checkout@v4
      with:
        repository: kdrag0n/proton-clang
        path: clang-toolchain
        fetch-depth: 1

    - name: Load Configuration
      run: |
        if [ -f config.env ]; then
          export $(cat config.env | xargs)
        fi
        echo "KERNEL_SOURCE=${KERNEL_SOURCE}" >> $GITHUB_ENV
        echo "KERNEL_SOURCE_BRANCH=${KERNEL_SOURCE_BRANCH}" >> $GITHUB_ENV
        echo "KERNEL_DEFCONFIG=${KERNEL_DEFCONFIG}" >> $GITHUB_ENV
        echo "KERNEL_FILE=${KERNEL_FILE}" >> $GITHUB_ENV

    - name: Clone Kernel Source
      run: |
        git clone --depth=1 --branch $KERNEL_SOURCE_BRANCH $KERNEL_SOURCE android-kernel

    - name: Build Kernel
      run: |
        cd android-kernel
        export PATH=$GITHUB_WORKSPACE/clang-toolchain/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        
        # Fixing configuration path just in case
        make O=out $KERNEL_DEFCONFIG

        # Actual Build Command
        make -j$(nproc --all) O=out \
             CC=clang \
             CROSS_COMPILE=aarch64-linux-gnu- \
             CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
             LD=ld.lld \
             AR=llvm-ar \
             NM=llvm-nm \
             OBJCOPY=llvm-objcopy \
             OBJDUMP=llvm-objdump \
             STRIP=llvm-strip

    - name: Pack Kernel (AnyKernel3)
      run: |
        git clone https://github.com/osm0sis/AnyKernel3
        cp android-kernel/out/arch/arm64/boot/$KERNEL_FILE AnyKernel3/
        cd AnyKernel3
        zip -r9 kernel-nethunter.zip *

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NetHunter-Kernel-Lime-Final
        path: AnyKernel3/kernel-nethunter.zip
