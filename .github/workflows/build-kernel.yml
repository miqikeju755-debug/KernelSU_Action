name: Build Kernel (Universal Root)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: write
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Setup Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y git make bc bison flex build-essential libssl-dev libncurses5-dev unzip zip

    - name: Get Proton Clang
      uses: actions/checkout@v4
      with:
        repository: kdrag0n/proton-clang
        path: clang-toolchain
        fetch-depth: 1

    - name: Clone Kernel Source
      run: |
        git clone --depth=1 --branch 14 https://github.com/hac4us06/kernel-xiaomi-electro android-kernel

    - name: Build Kernel
      run: |
        cd android-kernel
        export PATH=$GITHUB_WORKSPACE/clang-toolchain/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export KBUILD_BUILD_USER="Tamjid"
        export KBUILD_BUILD_HOST="NetHunter-Lab"
        
        # 1. Clean
        make O=out clean
        make O=out mrproper

        # 2. Configure
        make O=out vendor/chime_defconfig

        # --- 🛠️ ROOT SUPPORT (Magisk Delta & APatch) 🛠️ ---
        # এই লাইনগুলো Magisk Delta এবং APatch এর জন্য জরুরি
        scripts/config --file out/.config --enable CONFIG_KALLSYMS
        scripts/config --file out/.config --enable CONFIG_KALLSYMS_ALL
        scripts/config --file out/.config --enable CONFIG_KPROBES
        scripts/config --file out/.config --enable CONFIG_HAVE_KPROBES
        scripts/config --file out/.config --enable CONFIG_KPROBE_EVENTS
        scripts/config --file out/.config --enable CONFIG_OVERLAY_FS

        # --- 🐉 NETHUNTER FEATURES 🐉 ---
        # HID / BadUSB Support
        scripts/config --file out/.config --enable CONFIG_USB_CONFIGFS_F_HID
        scripts/config --file out/.config --enable CONFIG_USB_F_HID
        
        # WiFi Monitor Mode Support
        scripts/config --file out/.config --enable CONFIG_CFG80211
        scripts/config --file out/.config --enable CONFIG_MAC80211
        scripts/config --file out/.config --enable CONFIG_MAC80211_RC_MINSTREL
        scripts/config --file out/.config --enable CONFIG_MAC80211_RC_MINSTREL_HT
        
        # Disable Errors
        scripts/config --file out/.config --disable CONFIG_DEBUG_INFO_BTF
        scripts/config --file out/.config --disable CONFIG_WERROR
        scripts/config --file out/.config --disable CONFIG_MODULE_SIG

        # ---------------------------------------

        # 3. Build
        make -j$(nproc --all) O=out \
             CC=clang \
             CROSS_COMPILE=aarch64-linux-gnu- \
             CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
             LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
             KCFLAGS="-w"

    - name: Smart Pack (AnyKernel3)
      run: |
        git clone https://github.com/osm0sis/AnyKernel3
        
        # Auto-create fixing script
        rm AnyKernel3/anykernel.sh
        cat <<EOF > AnyKernel3/anykernel.sh
        properties() { '
        kernel.string=NetHunter Kernel by Tamjid
        do.devicecheck=0
        do.modules=0
        do.systemless=1
        do.cleanup=1
        do.cleanuponabort=0
        '; }
        block=/dev/block/bootdevice/by-name/boot;
        is_slot_device=0;
        ramdisk_compression=auto;
        patch_vbmeta_flag=auto;
        . tools/ak3-core.sh;
        dump_boot;
        write_boot;
        EOF

        # Copy Image
        find android-kernel/out/arch/arm64/boot -name "Image*" -print -exec cp {} AnyKernel3/ \;
        find android-kernel/out/arch/arm64/boot -name "dtbo.img" -print -exec cp {} AnyKernel3/ \; || true

        cd AnyKernel3
        mv Image.gz-dtb Image || true
        mv Image.gz Image || true
        
        zip -r9 kernel-nethunter-universal.zip *

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NetHunter-Universal-Kernel
        path: AnyKernel3/kernel-nethunter-universal.zip
