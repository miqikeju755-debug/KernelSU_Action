name: Build Kernel (Final Fix)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: write
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Setup Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y git make bc bison flex build-essential libssl-dev libncurses5-dev unzip zip

    - name: Get Proton Clang
      uses: actions/checkout@v4
      with:
        repository: kdrag0n/proton-clang
        path: clang-toolchain
        fetch-depth: 1

    - name: Clone Kernel Source
      run: |
        # এখানে আমি সরাসরি আপনার লিংক এবং ব্রাঞ্চ দিয়ে দিয়েছি
        git clone --depth=1 --branch 14 https://github.com/hac4us06/kernel-xiaomi-electro android-kernel

    - name: Build Kernel
      run: |
        cd android-kernel
        export PATH=$GITHUB_WORKSPACE/clang-toolchain/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        
        # 1. Clean
        make O=out clean
        make O=out mrproper

        # 2. Configure (vendor/chime_defconfig)
        make O=out vendor/chime_defconfig

        # 3. FORCE DISABLE ERRORS (The Magic Fix)
        # BTF বন্ধ করা হচ্ছে (যা ১১ মিনিটে এরর দেয়)
        scripts/config --file out/.config --disable CONFIG_DEBUG_INFO_BTF
        # ওয়ার্নিং বন্ধ করা হচ্ছে
        scripts/config --file out/.config --disable CONFIG_WERROR
        # মডিউল সাইন এবং কি (Key) সমস্যা বন্ধ করা হচ্ছে
        scripts/config --file out/.config --disable CONFIG_MODULE_SIG
        scripts/config --file out/.config --disable CONFIG_SYSTEM_TRUSTED_KEYS
        scripts/config --file out/.config --disable CONFIG_SYSTEM_REVOCATION_KEYS

        # 4. Build Start
        make -j$(nproc --all) O=out \
             CC=clang \
             CROSS_COMPILE=aarch64-linux-gnu- \
             CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
             LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
             KCFLAGS="-w"

    - name: Smart Pack (AnyKernel3)
      run: |
        git clone https://github.com/osm0sis/AnyKernel3
        
        # স্মার্ট কপি: ফাইলের নাম যা-ই হোক, খুঁজে বের করে আনবে
        echo "Looking for kernel image..."
        find android-kernel/out/arch/arm64/boot -name "Image*" -print -exec cp {} AnyKernel3/ \;
        
        # যদি dtb আলাদা থাকে, সেটাও কপি করবে
        find android-kernel/out/arch/arm64/boot -name "dtbo.img" -print -exec cp {} AnyKernel3/ \; || true

        cd AnyKernel3
        # নামের ঝামেলা মেটানো (AnyKernel3 সাধারণত Image চায়)
        mv Image.gz-dtb Image || true
        mv Image.gz Image || true
        
        zip -r9 kernel-nethunter.zip *

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NetHunter-Kernel-Final
        path: AnyKernel3/kernel-nethunter.zip
